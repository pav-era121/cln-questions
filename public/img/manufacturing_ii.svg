<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#bg)"/>

  <!-- Blueprint Grid Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>

    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="650" y1="0" x2="650" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
  </g>

  <!-- Glow Arc -->
  <circle cx="400" cy="230" r="160" fill="url(#glow)"/>

  <!-- Precision Gear Graphic -->
  <g transform="translate(400, 210)" stroke="#6366f1" stroke-width="4" fill="none">
    <circle cx="0" cy="0" r="110" stroke="#818cf8" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="85" stroke="url(#cyan)" stroke-width="6"/>
    <circle cx="0" cy="0" r="38" fill="#1e1b4b" stroke="url(#gold)" stroke-width="5"/>
    <circle cx="0" cy="0" r="12" fill="#fbbf24"/>
    
    <!-- Gear Spokes -->
    <line x1="0" y1="-85" x2="0" y2="-38" stroke="#38bdf8" stroke-width="6"/>
    <line x1="0" y1="85" x2="0" y2="38" stroke="#38bdf8" stroke-width="6"/>
    <line x1="-85" y1="0" x2="-38" y2="0" stroke="#38bdf8" stroke-width="6"/>
    <line x1="85" y1="0" x2="38" y2="0" stroke="#38bdf8" stroke-width="6"/>
    <line x1="-60" y1="-60" x2="-27" y2="-27" stroke="#38bdf8" stroke-width="5"/>
    <line x1="60" y1="60" x2="27" y2="27" stroke="#38bdf8" stroke-width="5"/>
    <line x1="60" y1="-60" x2="27" y2="-27" stroke="#38bdf8" stroke-width="5"/>
    <line x1="-60" y1="60" x2="-27" y2="27" stroke="#38bdf8" stroke-width="5"/>

    <!-- Cutting Tool & Chip Graphic -->
    <path d="M 60,-15 L 125,-15 L 140,-5 L 115,20 L 70,5 Z" fill="#f59e0b" stroke="#fde047" stroke-width="2"/>
    <!-- Curled Chip -->
    <path d="M 60,-18 Q 45,-45 20,-35 Q 5,-25 15,-10" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Badges & Titles -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- Top Pill Badge -->
    <rect x="290" y="38" width="220" height="32" rx="16" fill="rgba(124, 58, 237, 0.3)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="400" y="59" fill="#c084fc" font-size="12" font-weight="700" letter-spacing="2">PRIVATE ADVANCED COURSE</text>

    <!-- Main Title -->
    <text x="400" y="385" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="1">MANUFACTURING ENGINEERING II</text>
    <!-- Subtitle -->
    <text x="400" y="418" fill="#94a3b8" font-size="16" font-weight="500">MEng 31xx · Machining, Kinematics &amp; Joining</text>

    <!-- Stat Pill -->
    <rect x="250" y="442" width="300" height="32" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="#334155" stroke-width="1"/>
    <text x="400" y="463" fill="#38bdf8" font-size="13" font-weight="700">7 Chapters · 14 Quizzes · 700 Solved MCQs</text>
  </g>
</svg>
