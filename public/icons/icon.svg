<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2447"/>
      <stop offset="100%" stop-color="#1e4585"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ffd166" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with smooth rounded rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Golden circular border -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#ffd166" stroke-width="8" stroke-dasharray="1370" opacity="0.9"/>

  <!-- Graduation Cap -->
  <g transform="translate(256, 195)" filter="url(#goldGlow)">
    <!-- Mortarboard Top -->
    <polygon points="0,-75 160,-22 0,31 -160,-22" fill="#ffffff" stroke="#ffd166" stroke-width="8"/>
    <!-- Cap Skull -->
    <path d="M -85,-5 L -85,42 C -85,82 85,82 85,42 L 85,-5 Z" fill="#eff6ff" stroke="#ffd166" stroke-width="7"/>
    <!-- Button -->
    <circle cx="0" cy="-22" r="10" fill="#ffd166"/>
    <!-- Tassel -->
    <path d="M 0,-22 Q 100,-15 130,25 L 136,55" fill="none" stroke="#ffd166" stroke-width="6" stroke-linecap="round"/>
    <polygon points="132,55 140,55 136,75" fill="#ffd166"/>
  </g>

  <!-- CLN Brand Text -->
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#ffd166" text-anchor="middle" letter-spacing="6">CLN</text>
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4" opacity="0.85">QUESTIONS</text>
</svg>
